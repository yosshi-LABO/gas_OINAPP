<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>押印申請 一覧画面</title>
  <style>
    <?!= include('css_common'); ?>
    <?!= include('css_list'); ?>
  </style> 
    <?!= include('js_common'); ?>
</head>

<body>
  <div class="container" style="max-width: 1080px;">
    
    <!-- ヘッダーエリア -->
    <div class="header-area">
      <h2>押印申請 一覧・検索</h2>

      <a href="<?= ScriptApp.getService().getUrl() ?>?page=form" target="_top" class="btn-secondary">
        + 新規申請画面へ
      </a>
    </div>

    <!-- ▼ 1. 一覧エリア ------------------------------------->
    <div id="listSection">

      <!-- 検索エリア -->
      <div class="search-bar">
        <input type="text" id="keyword" class="search-input text-input" placeholder="起案番号、申請者名、書類名などで検索..." onkeypress="handleKeyPress(event)">
        <button class="btn-primary search-btn" onclick="loadData()">検索</button>
      </div>

      <!-- データ一覧テーブル -->
      <div class="table-container">
        <table class="custom-table">
          <thead>
            <tr>
              <th>申請日</th>
              <th>起案番号</th>
              <th>所属会社</th>
              <th>申請者名</th>
              <th>書類名</th>
              <th>状態</th>
            </tr>
          </thead>
          <!-- 👇 JSで動的に上書きされる箇所 -->
          <tbody id="tableBody">
            <tr><td colspan="6" class="empty-row-msg">検索中...</td></tr>
          </tbody>
        </table>

        <!-- ページネーションエリア -->
        <div class="pagination-container">
          <button id="prevBtn" onclick="changePage(-1)" class="btn-page">← 前へ</button>
          <span id="pageInfo" class="page-info">1 / 1 ページ</span>
          <button id="nextBtn" onclick="changePage(1)" class="btn-page">次へ →</button>
        </div>
      </div>

    </div>

    <!-- ▼ 2. 詳細参照エリア ----------------------------------->
    <div id="detailSection" class="detail-card">

      <!-- ヘッダー＆ステータス表示＆戻るボタン -->
      <div class="detail-header">
        <div class="detail-header-left">
          <h3 class="detail-title">押印申請 詳細情報</h3>
          <span id="detailStatusBadge">-</span>
        </div>
        <button type="button" onclick="backToList()" class="btn-secondary">
          ← 一覧画面に戻る
        </button>
      </div>

      <!-- 左右2カラムレイアウト構造 -->
      <div class="detail-body-layout">
        <!-- 左エリア：申請情報 -->
        <div class="detail-main-info">
          <div id="detailGrid" class="detail-grid">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- 右エリア：処理履歴 -->
        <div class="detail-side-info">
          <div id="detailMetaArea" class="detail-meta-area">
            <!-- JSで描画 -->
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- ▼JavaScript部分 ------------------------------------------------------------------------>
  <script>
  /**
   * フィールドキーから日本語項目名への変換マップ
   * 詳細画面のラベル表示で使用します。
   */
  var labelMap = {
    applicationDate: '申請日',
    refNum: '起案番号',
    companyName: '起案会社',
    deptName: '所属部署',
    employeeId: '申請者ID',
    employeeName: '申請者名',
    deptType: '部署種別',
    sealCompany: '押印が必要な会社',
    partnerCompany: '相手先会社名',
    documentName: '書類名',
    copies: '部数',
    sealType: '押印種別',
    approvalNumber: '稟決番号',
    remarks: '備考'
  };

  /**
   * 詳細画面の表示セクション＆グリッドレイアウト設定
   * 各項目の表示順および CSS Grid の `grid-column`（スパン幅）を定義します。
   */
  var detailSectionsConfig = [
    {
      title: '基本情報',
      fields: [
        { key: 'applicationDate', span: 'span 6' },
        { key: 'refNum', span: 'span 6' }
      ]
    },
    {
      title: '申請者情報',
      fields: [
        { key: 'companyName',   span: 'span 4' },
        { key: 'deptName',      span: 'span 4' },
        { key: 'deptType',      span: 'span 4' },
        { key: 'employeeId',    span: 'span 4' },
        { key: 'employeeName',  span: 'span 8' }
      ]
    },
    {
      title: '書類情報',
      fields: [
        { key: 'sealCompany',  span: 'span 6' },
        { key: 'partnerCompany', span: 'span 6' },
        { key: 'documentName',   span: 'span 5' },
        { key: 'copies',         span: 'span 1' },
        { key: 'sealType',       span: 'span 3' },
        { key: 'approvalNumber', span: 'span 3' },
        { key: 'remarks',        span: 'span 12' }
      ]
    }
  ];

  // --- グローバル状態管理変数 ---
  var allData = [];      // バックエンドから取得した全申請データリスト
  var currentPage = 1;  // 現在の表示ページ番号
  var rowsPerPage = 10; // 1ページあたりの表示件数

  // 画面ロード完了時にデータを自動取得
  window.onload = function() {
    loadData();
  };


  /**
   * 検索窓での Enter キー押下検知ハンドラ
   * @param {KeyboardEvent} e - キーボードイベント
   */
  function handleKeyPress(e) {
    if (e.keyCode === 13) {
      loadData();
    }
  }


  /**
   * 申請一覧データの非同期取得処理
   * 検索キーワードをもとに GAS バックエンド（getFilteredData）からデータを読み込みます。
   */
  function loadData() {
    var keyword = document.getElementById('keyword').value;
    var tbody = document.getElementById('tableBody');
    // ロード中のスケルトン表示
    tbody.innerHTML = '<tr><td colspan="6" class="empty-row-msg">検索中...</td></tr>';

    google.script.run
      .withSuccessHandler(function(data) {
        allData = data || [];
        currentPage = 1; // ページを1ページ目にリセット
        renderTable();    // テーブル再描画
      })
      .withFailureHandler(function(error) {
        alert("データの取得に失敗しました: " + error.message);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #dc2626; padding: 24px;">データの取得に失敗しました。</td></tr>';
      })
      .getFilteredData(keyword);
  }


  /**
   * テーブル行データおよびページネーションのレンダリング
   * 現在のページ番号（currentPage）に応じて `allData` から10件分を切り出して描画します。
   */
  function renderTable() {
    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = "";

    // 該当データが0件の場合のメッセージ表示
    if (allData.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-row-msg">該当するデータが見つかりませんでした。</td></tr>';
      if (document.getElementById('pageInfo')) document.getElementById('pageInfo').textContent = '0 / 0 ページ';
      if (document.getElementById('prevBtn')) document.getElementById('prevBtn').disabled = true;
      if (document.getElementById('nextBtn')) document.getElementById('nextBtn').disabled = true;
      return;
    }
  
    // 現在のページに応じたデータのスライス位置計算
    var startIndex = (currentPage - 1) * rowsPerPage;
    var endIndex = startIndex + rowsPerPage;
    var displayData = allData.slice(startIndex, endIndex);

    // 行（<tr>）要素の生成とクリックイベント付与
    displayData.forEach(function(row) {
      var tr = document.createElement('tr');
      tr.title = "クリックして詳細を表示";
      tr.onclick = function() { showDetail(row); }; // 行クリックで詳細表示へ遷移
      
      tr.innerHTML = `
        <td>${row.applicationDate || ''}</td>
        <td><strong>${row.refNum || ''}</strong></td>
        <td>${row.companyName || ''}</td>
        <td>${row.employeeName || ''}</td>
        <td>${row.documentName || ''}</td>
        <td><span class="status-badge ${getStatusClass(row.status)}">${row.status|| ''}
        `;
      tbody.appendChild(tr);
    });

    // ページネーションコントロール（ページ番号・前へ/次へボタン状態）の更新
    var totalPages = Math.ceil(allData.length / rowsPerPage);
    if (document.getElementById('pageInfo')) {
      document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages} ページ（全 ${allData.length} 件）`;
    }
    if (document.getElementById('prevBtn')) document.getElementById('prevBtn').disabled = (currentPage === 1);
    if (document.getElementById('nextBtn')) document.getElementById('nextBtn').disabled = (currentPage >= totalPages);
  }


  /**
   * ページ切替（前へ / 次へ）ボタン処理
   * @param {number} direction - ページ移動方向（-1 または 1）
   */
  function changePage(direction) {
    currentPage += direction;
    renderTable();
  }


  /**
   * 選択行の申請詳細画面表示処理
   * テーブルで選択されたオブジェクトを受け取り、CSS Grid形式で各項目を出力します。
   * @param {Object} row - 一覧テーブルから受け取った単一の申請データオブジェクト
   */
  function showDetail(row) {
    var gridContainer = document.getElementById('detailGrid');
    gridContainer.innerHTML = '';

    // 1. ステータスバッジのラベルとデザイン色の切り替え
    var statusBadge = document.getElementById('detailStatusBadge');
    statusBadge.textContent = row.status;
    statusBadge.className = `status-badge ${getStatusClass(row.status)}`; 

    // 2. 設定オブジェクト（detailSectionsConfig）に基づいてセクションと各項目を自動動的生成
    detailSectionsConfig.forEach(function(section) {
      var titleHtml = `<div class="detail-section-title">— ${section.title} —</div>`;
      gridContainer.insertAdjacentHTML('beforeend', titleHtml);

      section.fields.forEach(function(f) {
        var label = labelMap[f.key] || f.key;
        var value = (row[f.key] !== null && row[f.key] !== undefined && row[f.key] !== '') ? row[f.key] : '-';

        var itemHtml = `
          <div class="detail-item" style="grid-column: ${f.span};">
            <div class="detail-label">${label}</div>
            <div class="detail-value">${value}</div>
          </div>
        `;
        gridContainer.insertAdjacentHTML('beforeend', itemHtml);
      });
    });
      
    // 3. 該当レコードの処理履歴（タイムライン）描画
    var metaArea = document.getElementById('detailMetaArea');

    // 共通関数（js_common）を利用してタイムラインHTMLを生成・セット
    var timelineHtml = '<div class="timeline-title">【処理履歴】</div>'
       + generateTimelineHtml(row.history); // ↘️　generateTimelineHtml は共有ファイル(js_common)内にあります。
    metaArea.innerHTML = timelineHtml;

    // 画面表示の切替（一覧を隠して詳細を表示）
    document.getElementById('listSection').style.display = 'none';
    document.getElementById('detailSection').style.display = 'block';
  }                    


  /**
   * 詳細画面から一覧画面へ戻るボタン処理（今度は一つ上のソースとは逆に、詳細を隠して一覧を表示）
   */
  function backToList() {
    document.getElementById('detailSection').style.display = 'none';
    document.getElementById('listSection').style.display = 'block';
  }


  /**
   * ステータス文字列に応じたCSSクラス名を返す
   */
  function getStatusClass(status) {
    if (status === '承認完了') return 'status-approved';
    if (status === '差戻し') return 'status-rejected';
    return 'status-pending'; // 「申請中」または初期値
  }

  </script>
</body>
</html>
