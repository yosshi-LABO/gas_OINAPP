  <!-- ▼JavaScript部分 ------------------------------------------------------------------------>
  <script>












/**
     * =========================================================================
     * 1. バリデーションルールの定義（設定データ）
     * =========================================================================
     * 各入力項目の検証ルールを一元管理する配列です。
     * 今後フォーム項目が増減した場合も、この配列を編集するだけで自動適用されます。
     * 
     * 【プロパティ説明】
     * - id       : HTML側の要素ID（エラー表示用要素は id + 'Error' と想定）
     * - type     : フォーム要素の種別（'text' または 'checkbox'）
     * - required : 必須項目かどうか（true / false）
     * - pattern  : 正規表現のチェックパターン（任意）
     * - message  : エラー発生時に表示するメッセージテキスト
     */
    var validationRules = [
      { id: 'companyName',   type: 'text',     required: true,  message: 'ここは必須項目です。' },
      { id: 'deptName',      type: 'text',     required: true,  message: 'ここは必須項目です。' },
      { id: 'employeeId',    type: 'text',     pattern: /^\d{6}$/, message: '社員番号は半角6桁での記入(先頭0埋め)が必要です。' },
      { id: 'employeeName',  type: 'text',     required: true,  message: 'ここは必須項目です。' },
      { id: 'sealCompany',   type: 'checkbox', required: true,  message: '最低1つ選択してください。' },
      { id: 'documentName',  type: 'text',     required: true,  message: 'ここは必須項目です。' },
      { id: 'approverEmail', type: 'text',     required: true,  message: 'ここは必須項目です。' }
    ];


    /**
     * =========================================================================
     * 💡 判定ヘルパー関数（単一ルールの検証）
     * =========================================================================
     * 受け取った1つのルール（rule）に対して、入力値が違反しているか判定します。
     * @param {Object} rule - validationRules 内の1オブジェクト
     * @returns {boolean} - エラーがある場合は true、正常な場合は false を返却
     */
    function checkRuleError(rule) {
      // --------------------------------------------------
      // A. チェックボックス群の判定ロジック
      // --------------------------------------------------
      if (rule.type === 'checkbox') {
        // name属性が一致する選択済み（:checked）のチェックボックスを取得
        var checked = document.querySelectorAll('input[name="' + rule.id + '"]:checked');
        
        // 必須設定で、選択数が0件の場合はエラー(true)
        if (rule.required) {
          if (checked.length === 0) {
            return true;
          }
        }
        return false;
      }

      // --------------------------------------------------
      // B. テキスト入力等の判定ロジック
      // --------------------------------------------------
      var elem = document.getElementById(rule.id);
      
      // 対象要素がDOM上に存在しない場合はチェックをスキップ（正常扱い）
      if (!elem) {
        return false;
      }

      // 前後の不要な空白を除去した入力値を取得
      var val = elem.value.trim();

      // 必須チェック：必須指定があるのに値が空ならエラー(true)
      if (rule.required) {
        if (val === "") {
          return true;
        }
      }

      // 正規表現パターンチェック：値が入力されている場合のみ形式検証
      if (val) {
        if (rule.pattern) {
          // 正規表現パターンに合致しない場合はエラー(true)
          if (!rule.pattern.test(val)) {
            return true;
          }
        }
      }

      // すべてのチェックをクリアした場合は正常(false)
      return false;
    }


    /**
     * =========================================================================
     * 💡 3. リアルタイム単一項目バリデーション
     * =========================================================================
     * 各入力欄のフォーカスが外れた際（onblur等）に個別に呼び出されます。
     * 正しく入力されていれば、その項目のエラーメッセージをリアルタイムで非表示にします。
     * @param {string} fieldId - チェック対象の要素ID
     */
    function validateField(fieldId) {
      // 定義配列から対象フィールドIDに該当するルールを取得
      var rule = validationRules.find(function(r) { return r.id === fieldId; });
      
      // 該当するルールが未定義なら何もしない
      if (!rule) {
        return;
      }

      // 対応するエラーメッセージ表示要素を取得
      var errElem = document.getElementById(rule.id + 'Error');
      
      // エラー表示領域が存在しない場合は何もしない
      if (!errElem) {
        return;
      }

      // 単一要素のエラー判定を実行
      var isError = checkRuleError(rule);

      // エラーが解消（isError === false）されていれば赤文字メッセージを隠す
      if (!isError) {
        errElem.style.display = 'none';
      }
    }


    /**
     * =========================================================================
     * 💡 4. フォーム全体チェック & 送信処理
     * =========================================================================
     * 送信ボタン押下時に起動。全ルールのループ検証を行い、
     * エラーがなければ二重送信防止制御をかけてGASバックエンドへデータを送信します。
     * @param {string} notifyType - 通知種別（'line' または 'gmail'）
     */
    function sendData(notifyType) {
      var isValid = true;             // フォーム全体の検証成功フラグ
      var firstErrorElement = null;   // エラー時に最初にフォーカスさせるHTML要素

      // --------------------------------------------------
      // STEP 1: 全ルールのループ一括チェック
      // --------------------------------------------------
      validationRules.forEach(function(rule) {
        var errElem = document.getElementById(rule.id + 'Error');
        
        // 共通ヘルパー関数でエラー有無を判定
        var isError = checkRuleError(rule);

        if (isError) {
          // 【エラーあり】メッセージのセットと表示
          if (errElem) {
            errElem.textContent = rule.message;
            errElem.style.display = 'block';
          }
          // 最初にエラーになった入力要素を保持（スクロール/フォーカス用）
          if (!firstErrorElement) {
            if (rule.type !== 'checkbox') {
              firstErrorElement = document.getElementById(rule.id);
            }
          }
          isValid = false; // 全体検証を「失敗」に設定
        } else {
          // 【エラーなし】メッセージを非表示
          if (errElem) {
            errElem.style.display = 'none';
          }
        }
      });

      // エラーが1点でもあれば、最初に引っかかった項目にフォーカスして処理中断
      if (!isValid) {
        if (firstErrorElement) {
          firstErrorElement.focus();
        }
        return;
      }

      // --------------------------------------------------
      // STEP 2: 二重送信防止 & ローディング UI 制御
      // --------------------------------------------------
      var btnLine = document.getElementById('btnLine');
      var btnGmail = document.getElementById('btnGmail');
      var targetBtn = (notifyType === 'line') ? btnLine : btnGmail;
      
      // ボタンの無効化（連打防止）
      if (btnLine) btnLine.disabled = true;
      if (btnGmail) btnGmail.disabled = true;
      
      var btnTextElem = targetBtn ? targetBtn.querySelector('.btn-text') : null;
      var spinnerElem = targetBtn ? targetBtn.querySelector('.spinner') : null;
      var originalText = btnTextElem ? btnTextElem.textContent : "";

      // スピナー回転表示と文言変更
      if (btnTextElem) btnTextElem.textContent = "送信中...";
      if (spinnerElem) spinnerElem.style.display = "inline-block";

      // --------------------------------------------------
      // STEP 3: 送信パラメータ用データの抽出・整形
      // --------------------------------------------------
      // 押印会社（チェックボックス群）の選択値を配列化
      var checkedSeal = document.querySelectorAll('input[name="sealCompany"]:checked');
      var selectedSealCompany = [];
      checkedSeal.forEach(function(checkbox) {
        selectedSealCompany.push(checkbox.value);
      });
      
      // 部署種別（ラジオボタン）の選択値取得
      var selectedDeptElem = document.querySelector('input[name="deptType"]:checked');
      var selectedDept = selectedDeptElem ? selectedDeptElem.value : "";

      // バックエンド（GAS）渡すデータオブジェクトの構築
      var data = {
        applicationDate: document.getElementById('applicationDate').value,
        refNum: document.getElementById('refNum').value,
        companyName: document.getElementById('companyName').value.trim(),
        deptName: document.getElementById('deptName').value.trim(),
        employeeId: document.getElementById('employeeId').value.trim(),
        employeeName: document.getElementById('employeeName').value.trim(),
        deptType: selectedDept,
        sealCompany: selectedSealCompany.join(', '), // カンマ区切り文字列に変換
        clientCompany: document.getElementById('clientCompany').value,
        documentName: document.getElementById('documentName').value.trim(),
        copies: document.getElementById('copies').value,
        sealType: document.getElementById('sealType').value,
        approvalNum: document.getElementById('approvalNum').value,
        remarks: document.getElementById('remarks').value,
        approverEmail: document.getElementById('approverEmail').value.trim(),
        notifyType: notifyType
      };

      // --------------------------------------------------
      // STEP 4: GAS バックエンド関数の非同期呼び出し
      // --------------------------------------------------
      google.script.run
        .withSuccessHandler(function(res) {
          // 成功時UI復旧 & 完了モーダル表示
          if (spinnerElem) spinnerElem.style.display = "none";
          if (btnTextElem) btnTextElem.textContent = originalText;
          showCompletionModal('success', '送信完了');
        })
        .withFailureHandler(function(error) {
          // 失敗時UIロック解除 & アラート表示
          if (btnLine) btnLine.disabled = false;
          if (btnGmail) btnGmail.disabled = false;
          if (spinnerElem) spinnerElem.style.display = "none";
          if (btnTextElem) btnTextElem.textContent = originalText;
          alert("送信に失敗しました: " + error.message);
        })
        .submitData(data);
    }







    
    /**
    * 💡 5. 処理完了時のモーダルポップアップ表示 & 自動遷移
    * 送信・承認・差戻しの完了時にモーダルダイアログを表示し、1.5秒後に一覧画面へ移動します。
    * @param {string} type - 'reject'（差戻し）または 'success'（成功・承認）
    * @param {string} titleText - モーダルに表示するタイトルテキスト（例：「送信完了」「承認完了」）
    */
    function showCompletionModal(type, titleText) {
      var successModal = document.getElementById('successModal');
      var modalIcon = document.getElementById('modalIcon');
      var modalTitle = document.getElementById('modalTitle');
      // 引数で受け取ったタイトルをそのままセット
      if (modalTitle) modalTitle.textContent = titleText 

      // 処理種別に応じたアイコン表示とCSSクラスの切替
      if (modalIcon) {
        if (type === 'reject') {
          modalIcon.textContent = '↩';
         modalIcon.className = 'modal-icon icon-reject';
        } else {
         modalIcon.textContent = '✓';
         modalIcon.className = 'modal-icon icon-success';
        }
      }

      // モーダルを表示（flexレイアウトで中央寄せ）
      if (successModal) successModal.style.display = 'flex';

      // 1.5秒（1500ms）後に一覧画面へ自動遷移
      setTimeout(function() {
        window.top.location.href = "<?= ScriptApp.getService().getUrl() ?>?page=list";
      }, 1500);
    }


    /*
    * 💡 6. 承認・差戻しアクション実行処理
    * @param {string} action - アクション種別（'approve' または 'reject'）
    */
    function submitApprovalAction(action) {
      var commentElem = document.getElementById("approvalComment");
      var comment = commentElem ? commentElem.value : "";
      var isReject = (action === "reject");
      
      // 差戻しの場合はコメント（理由）の入力を必須化
      if (isReject && !comment.trim()) {
        alert("差戻しを行う場合は、コメント（理由）の入力が必須です。");
        return;
      }

      // 連打防止のため承認・差戻しボタンを無効化
      var approveBtn = document.getElementById("btnApprove");
      var rejectBtn = document.getElementById("btnReject");
      if (approveBtn) approveBtn.disabled = true;
      if (rejectBtn) rejectBtn.disabled = true;

      var refNum = document.getElementById("refNum").value;


      // GASのサーバー側関数 processApprovalAction(refNum, action, comment) を非同期実行
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            var isRejectAction = (action === 'reject');
            
            // 処理種別に応じたタイトルでモーダルを表示
            var modalTitle = isRejectAction ? '差戻し完了' : '承認完了';
            
            showCompletionModal(isRejectAction ? 'reject' : 'success', modalTitle);

          } else {
            // サーバー側でエラーが返却された場合
            document.getElementById("approvalResult").innerText = "エラー: " + res.message;
            document.getElementById("approvalResult").style.color = "#dc2626";
            if (approveBtn) approveBtn.disabled = false;
            if (rejectBtn) rejectBtn.disabled = false;
          }
        })
        .withFailureHandler(function(err) {
          // 通信失敗・例外時
          alert("エラーが発生しました: " + err.message);
          if (approveBtn) approveBtn.disabled = false;
          if (rejectBtn) rejectBtn.disabled = false;
        })
        .processApprovalAction(refNum, action, comment);
    }


    /**
    * 💡 7.処理履歴（タイムライン）の描画処理
    * サーバーから埋め込まれた `formData.history` データを読み込み、
    * 共通モジュール(js_common)の `generateTimelineHtml` 関数で生成されたHTMLを適用します。
    */
    function renderHistory() {
      var historyArea = document.getElementById('historyListArea');
      if (!historyArea) return;

      // テンプレートスクリプトタグ経由でGASから渡された履歴オブジェクト配列を取得
      var rawHistory = <?!= JSON.stringify(formData.history || []) ?>;
      
      // 共通関数（js_common）を呼び出してタイムラインHTMLを割り当て
      historyArea.innerHTML = generateTimelineHtml(rawHistory);
    }                   // ↘️　generateTimelineHtml は共有ファイル(js_common)内にあります。

    // ページ内のDOM構築完了時(読込時)に履歴描画を実行
    window.addEventListener('DOMContentLoaded', function() {
      renderHistory();
    });
  </script>
</body>
